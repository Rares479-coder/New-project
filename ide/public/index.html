<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDE C/C++</title>
  <link rel="stylesheet" href="/lib/xterm/css/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- bara de titlu -->
    <header id="titlebar">
      <div class="brand"><span class="logo">C++</span> IDE pentru învățat</div>
      <div class="title-actions">
        <select id="std-select" title="Standardul limbajului C++">
          <option value="c++11">C++11</option>
          <option value="c++14">C++14</option>
          <option value="c++17" selected>C++17</option>
          <option value="c++20">C++20</option>
        </select>
        <button id="btn-run" class="primary" title="Compilează și rulează (F5 sau Ctrl+Enter)">▶ Rulează</button>
        <button id="btn-stop" title="Oprește programul (Shift+F5)" disabled>■ Oprește</button>
        <button id="btn-theme" class="icon" title="Temă luminoasă / întunecată">Temă</button>
        <button id="btn-help" class="icon" title="Scurtături de tastatură">?</button>
      </div>
    </header>

    <div id="main">
      <!-- bara de activitati -->
      <nav id="activitybar">
        <button class="act active" data-view="explorer" title="Explorator (Ctrl+Shift+E)">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </button>
        <button class="act" data-view="lessons" title="Lecții">
          <svg viewBox="0 0 24 24"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg>
        </button>
      </nav>

      <!-- bara laterala -->
      <aside id="sidebar">
        <section id="view-explorer" class="view">
          <div class="view-header">
            <span id="ws-name">EXPLORATOR</span>
            <div class="view-actions">
              <button class="icon" id="btn-new-file" title="Fișier nou">＋</button>
              <button class="icon" id="btn-new-folder" title="Folder nou">⊞</button>
              <button class="icon" id="btn-refresh" title="Reîmprospătează">⟳</button>
              <button class="icon" id="btn-collapse" title="Restrânge tot">⊟</button>
            </div>
          </div>
          <div id="tree" tabindex="0"></div>
        </section>
        <section id="view-lessons" class="view hidden">
          <div class="view-header"><span>LECȚII</span></div>
          <div id="lessons"></div>
        </section>
      </aside>
      <div class="splitter vertical" id="split-sidebar"></div>

      <!-- zona de lucru -->
      <section id="workbench">
        <div id="tabs"></div>
        <div id="editor-area">
          <div id="editor"></div>
          <div id="preview" class="markdown hidden"></div>
          <div id="welcome">
            <h1>Bine ai venit! 👋</h1>
            <p>Deschide un fișier din <b>Explorator</b> sau o lecție din <b>Lecții</b>.</p>
            <ul>
              <li><kbd>F5</kbd> / <kbd>Ctrl</kbd>+<kbd>Enter</kbd> — compilează și rulează</li>
              <li><kbd>Ctrl</kbd>+<kbd>S</kbd> — salvează</li>
              <li><kbd>Ctrl</kbd>+<kbd>N</kbd> — fișier nou</li>
              <li><kbd>Ctrl</kbd>+<kbd>`</kbd> — arată / ascunde terminalul</li>
            </ul>
            <button class="primary" id="btn-welcome-new">Creează primul meu program</button>
          </div>
        </div>
        <div class="splitter horizontal" id="split-panel"></div>
        <div id="panel">
          <div id="panel-tabs">
            <button class="ptab active" data-panel="terminal">TERMINAL</button>
            <button class="ptab" data-panel="problems">PROBLEME <span id="problem-count" class="badge hidden">0</span></button>
            <div class="spacer"></div>
            <button class="icon" id="btn-clear" title="Golește terminalul">⌫</button>
            <button class="icon" id="btn-panel-close" title="Ascunde panoul (Ctrl+`)">✕</button>
          </div>
          <div id="panel-terminal" class="pbody"><div id="terminal"></div></div>
          <div id="panel-problems" class="pbody hidden"><div id="problems"></div></div>
        </div>
      </section>
    </div>

    <footer id="statusbar">
      <span id="st-state">Gata</span>
      <span id="st-compiler"></span>
      <div class="spacer"></div>
      <span id="st-problems" class="clickable">⊗ 0 ⚠ 0</span>
      <span id="st-cursor"></span>
      <span id="st-lang"></span>
    </footer>
  </div>

  <div id="ctxmenu" class="hidden"></div>
  <div id="modal" class="hidden"><div class="modal-box"></div></div>

  <script src="/lib/xterm/lib/xterm.js"></script>
  <script src="/lib/xterm-fit/addon-fit.js"></script>
  <script src="/lib/marked/marked.umd.js"></script>
  <script src="/lib/monaco/vs/loader.js"></script>
  <script src="/app.js"></script>
</body>
</html>
